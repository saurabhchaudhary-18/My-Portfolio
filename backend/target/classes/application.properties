```properties
# =========================================================
# APPLICATION CONFIGURATION
#http://localhost:5500/index.html   local link
# =========================================================

spring.application.name=portfolio


# =========================================================
# SERVER CONFIGURATION
# =========================================================

# Spring Boot backend will run on port 8080
server.port=8080


# =========================================================
# MYSQL DATABASE CONFIGURATION
# =========================================================

# Database name
spring.datasource.url=jdbc:mysql://localhost:3306/portfolio_db

# MySQL username
spring.datasource.username=portfolio_db

# MySQL password
# Replace YOUR_PASSWORD with your actual MySQL password
spring.datasource.password=Saurabh@123

# MySQL JDBC Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =========================================================
# JPA / HIBERNATE CONFIGURATION
# =========================================================

# Automatically creates/updates tables based on @Entity classes
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in the console
spring.jpa.show-sql=true

# Format SQL queries for readability
spring.jpa.properties.hibernate.format_sql=true

# MySQL dialect
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


# =========================================================
# JSON CONFIGURATION
# =========================================================

# Do not fail when JSON contains unknown fields
spring.jackson.deserialization.fail-on-unknown-properties=false
```
